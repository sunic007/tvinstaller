name: 🐞 Bug report / Ошибка / Xato
description: Something doesn't work / Что-то не работает / Nimadir ishlamayapti
labels: [bug]
body:
  - type: input
    id: tv
    attributes:
      label: TV model and year / Модель и год ТВ / Televizor modeli va yili
      placeholder: UE55BU8500 (2022)
    validations:
      required: true
  - type: input
    id: tizen
    attributes:
      label: Tizen version / Версия Tizen / Tizen versiyasi
      description: TV card → details / Карточка ТВ → подробнее / TV kartasi → batafsil
      placeholder: "6.5"
  - type: input
    id: app
    attributes:
      label: TV Installer version and phone / Версия TV Installer и телефон / TV Installer versiyasi va telefon
      description: Settings, bottom of the screen / Внизу экрана «Настройки» / «Sozlamalar» ekranining pastida
      placeholder: 2.3.4, Samsung Galaxy S23, Android 14
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло / Nima bo'ldi
      description: Steps, what you expected, a screenshot / Шаги, что ожидали, скриншот / Qadamlar, nima kutgandingiz, skrinshot
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log / Журнал / Jurnal
      description: Settings → Log → share (please remove anything private) / Настройки → Журнал → поделиться / Sozlamalar → Jurnal → ulashish
      render: text
