name: Telegram post

# Новый релиз — пост в группу @sunicapps (канал новостей удалён): название, раздел «что нового» на русском и ссылка.
# Нужен секрет TELEGRAM_BOT_TOKEN — бот-публикатор, админ канала с правом «Публикация сообщений».
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v2.3.5) — пост о релизе'
        required: false
      text:
        description: 'Или свой текст поста'
        required: false
      pin:
        description: 'Закрепить свой пост'
        type: boolean
        default: false
      delete:
        description: 'Удалить посты канала: номера через пробел (из ссылки t.me/sunicapps/N)'
        required: false

permissions:
  contents: read

jobs:
  manage:
    if: github.event_name == 'workflow_dispatch' && (inputs.text != '' || inputs.delete != '')
    runs-on: ubuntu-latest
    steps:
      - name: Own post / delete posts
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: '@sunicapps'
          TEXT: ${{ inputs.text }}
          PIN: ${{ inputs.pin }}
          DELETE: ${{ inputs.delete }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          def tg(method, **kw):
              kw['chat_id'] = os.environ['CHANNEL']
              data = urllib.parse.urlencode(kw).encode()
              try:
                  return json.load(urllib.request.urlopen('https://api.telegram.org/bot%s/%s' % (os.environ['TOKEN'], method), data))
              except urllib.error.HTTPError as e:
                  return json.load(e)
          for n in os.environ['DELETE'].split():
              print('delete', n, tg('deleteMessage', message_id=n).get('ok'))
          text = os.environ['TEXT'].replace('\\n', '\n')        # в форме GitHub одна строка: \n — перенос
          if text:
              res = tg('sendMessage', text=text, disable_web_page_preview='true')
              print('post', res.get('ok'), res.get('description', ''))
              if res.get('ok') and os.environ['PIN'] == 'true':
                  pin = tg('pinChatMessage', message_id=res['result']['message_id'], disable_notification='true')
                  print('pin', pin.get('ok'), pin.get('description', ''))
          PY

  post:
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: '@sunicapps'
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Нет секрета TELEGRAM_BOT_TOKEN — пропускаю"; exit 0; fi
          gh release view "$TAG" -R "$REPO" --json name,body,url > rel.json
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          r = json.load(open('rel.json', encoding='utf-8'))
          body = r.get('body') or ''
          m = re.search(r'\*\*RU\*\*\s*\n(.*?)(?:\n\s*\*\*[A-Z]{2}\*\*|\Z)', body, re.S)
          notes = (m.group(1) if m else body).strip()
          notes = re.sub(r'\*\*(.+?)\*\*', r'\1', notes)            # без разметки GitHub
          notes = re.sub(r'`([^`]*)`', r'\1', notes)
          notes = re.sub(r'^\s*[-*]\s+', '• ', notes, flags=re.M)
          notes = re.sub(r'(?m)^Download .*\n?', '', notes).strip()   # строка про файлы для GitHub — в канале есть «Скачать»
          repo = os.environ['REPO']
          app = 'TV Installer' if repo.endswith('tvinstaller') else 'Lampa для Samsung'
          dl = ('https://github.com/%s/releases/latest/download/SunicTvInstaller.apk' % repo) if repo.endswith('tvinstaller') \
               else ('https://github.com/%s/releases/latest/download/samsung.wgt' % repo)
          tail = '\n\n⬇️ Скачать: ' + dl + '\n📄 Подробнее: ' + r['url'] + '\n💬 Вопросы: @sunicapps'
          if not repo.endswith('tvinstaller'):
              tail = '\n\nLampa на ТВ обновится сама.' + tail
          name = re.sub(r'^' + re.escape(app) + r'\s*', '', r['name'])   # «TV Installer 2.3.5 — …» без повтора названия
          text = '🆕 ' + app + ' ' + name + '\n\n' + notes
          text = text[:4096 - len(tail)] + tail
          data = urllib.parse.urlencode({'chat_id': os.environ['CHANNEL'], 'text': text, 'disable_web_page_preview': 'true'}).encode()
          res = json.load(urllib.request.urlopen('https://api.telegram.org/bot%s/sendMessage' % os.environ['TOKEN'], data))
          print('ok' if res.get('ok') else res)
          PY
