name: Refresh app catalog

# TV Installer downloads its app list from docs/catalog.json (GitHub Pages).
# Once a week this picks up new GitHub releases of the listed apps, so users get
# new builds without a new TV Installer release.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update to the latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_catalog.py docs/catalog.json

      - name: Check the file still parses
        run: python -c "import json; d=json.load(open('docs/catalog.json', encoding='utf-8')); assert len(d['services']) > 50"

      - name: Commit if anything changed
        run: |
          if git diff --quiet docs/catalog.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          git commit -m "catalog: new app releases"
          git push
